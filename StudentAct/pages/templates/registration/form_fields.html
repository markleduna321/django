{% for field in form %}
    <div class="mb-4">
        <label for="{{ field.id_for_label }}" class="block mb-1 font-medium">{{ field.label }}</label>
        {{ field }}
        {% for error in field.errors %}<p class="mt-1 text-sm text-red-600">{{ error }}</p>{% endfor %}
    </div>
{% endfor %}
{% for error in form.non_field_errors %}<p class="mb-4 text-sm text-red-600">{{ error }}</p>{% endfor %}
