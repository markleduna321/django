<li class="flex items-center gap-3 py-3">
    <input type="checkbox" class="h-5 w-5 cursor-pointer"
           {% if task.is_done %}checked{% endif %}
           hx-post="{% url 'task_toggle' task.pk %}"
           hx-target="closest li"
           hx-swap="outerHTML">
    <span class="flex-1 {% if task.is_done %}line-through text-gray-400{% endif %}">{{ task.title }}</span>
    <button class="text-sm text-red-600 hover:underline"
            hx-post="{% url 'task_delete' task.pk %}"
            hx-target="closest li"
            hx-swap="outerHTML"
            hx-confirm="Delete this task?">Delete</button>
</li>
