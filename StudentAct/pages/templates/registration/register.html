{% extends 'pages/base_public.html' %}

{% block title %}Register{% endblock %}

{% block content %}
    <h1 class="text-2xl font-bold mb-4">Register</h1>
    <form method="post">
        {% csrf_token %}
        {% include 'registration/form_fields.html' %}
        <button class="w-full rounded bg-blue-600 px-4 py-2 text-white hover:bg-blue-700">Create account</button>
    </form>
    <p class="mt-4 text-sm">Have an account? <a href="{% url 'login' %}" class="text-blue-600 hover:underline">Log in</a></p>
{% endblock %}
