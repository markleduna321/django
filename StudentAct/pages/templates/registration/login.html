{% extends 'pages/base_public.html' %}

{% block title %}Log in{% endblock %}

{% block content %}
    <h1 class="text-2xl font-bold mb-4">Log in</h1>
    <form method="post">
        {% csrf_token %}
        {% include 'registration/form_fields.html' %}
        <input type="hidden" name="next" value="{{ next }}">
        <button class="w-full rounded bg-blue-600 px-4 py-2 text-white hover:bg-blue-700">Log in</button>
    </form>
    <p class="mt-4 text-sm">No account? <a href="{% url 'register' %}" class="text-blue-600 hover:underline">Register</a></p>
{% endblock %}
