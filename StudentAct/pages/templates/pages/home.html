{% extends 'pages/base_public.html' %}

{% block content %}
    <h1 class="text-2xl font-bold mb-4">My Tasks</h1>

    <form class="flex gap-2 mb-6"
          hx-post="{% url 'task_create' %}"
          hx-target="#task-list"
          hx-swap="afterbegin"
          hx-on::after-request="if (event.detail.successful) this.reset()">
        {{ form.title }}
        <button class="rounded bg-blue-600 px-4 py-2 text-white hover:bg-blue-700">Add</button>
    </form>

    <ul id="task-list" class="divide-y">
        {% for task in tasks %}
            {% include 'pages/partials/task_item.html' %}
        {% endfor %}
        <li class="hidden only:block py-4 text-center text-gray-500">No tasks yet.</li>
    </ul>
{% endblock %}
